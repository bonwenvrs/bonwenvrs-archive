<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bonwenvrs-archive</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="site-title">bonwenvrs-archive</h1>
      <p class="site-subtitle">Story Collection &amp; Chapters</p>
    </div>
  </header>

  <main class="container">
    <section id="stories-container" class="stories-grid" aria-live="polite"></section>

    <section id="reader-view" class="reader-view hidden" aria-hidden="true">
      <button type="button" id="back-to-archive" class="btn-back">&larr; Back to Archive</button>
      <article class="reader-card">
        <h2 id="reader-title" class="reader-title"></h2>
        <p id="reader-intro" class="story-intro reader-intro"></p>
        <div id="reader-chapters" class="reader-chapters"></div>
        <div id="reader-content" class="reader-content"></div>
      </article>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
